<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup & Login</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #4facfe, #00f2fe);
    margin: 0;
}

/* Container */
.container {
    width: 300px;
    margin: 80px auto;
}

/* Card */
.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
}

h2 {
    text-align: center;
    margin-top: 15px;
}

/* Input */
input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

/* Button */
button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 5px;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.signup-btn {
    background: #28a745;
}

.login-btn {
    background: #007bff;
}

button:hover {
    opacity: 0.9;
}

/* Message */
p {
    text-align: center;
    font-weight: bold;
}

</style>

</head>
<body>

<div class="container">

<!-- Single Card -->
<div class="card">

    <!-- Signup Section -->
    <h2>Signup</h2>
    User ID:
    <input id="uid" type="text"><br><br>
    Password:
    <input id="upwd" type="password"><br><br>
    <button class="signup-btn" onclick="signup()">Create Account</button>
    <p id="message" style="color: green;"></p>

    <hr>

    <!-- Login Section -->
    <h2>Login</h2>
    User ID:
    <input id="lui" type="text"><br><br>
    Password:
    <input id="lupwd" type="password"><br><br>
    <button class="login-btn" onclick="login()">Login</button>
    <p id="msg_pwd" style="color: green;"></p>

</div>

</div>

<script>

function signup(){
    let user_id = document.getElementById("uid").value.trim();
    let user_pwd = document.getElementById("upwd").value.trim();

    if(user_id === "" || user_pwd === ""){
        document.getElementById("message").innerHTML = "⚠ Fill all fields";
        return;
    }

    localStorage.setItem("user_id", user_id);
    localStorage.setItem("user_pwd", user_pwd);

    document.getElementById("message").innerHTML = "✅ Account Created Successfully";

    document.getElementById("uid").value="";
    document.getElementById("upwd").value="";
}

function login(){
    let login_id = document.getElementById("lui").value.trim();
    let login_pwd = document.getElementById("lupwd").value.trim();

    let sui = localStorage.getItem("user_id");
    let supwd = localStorage.getItem("user_pwd");

    if (login_id === sui && login_pwd === supwd){
        document.getElementById("msg_pwd").innerHTML = "✅ Login Successfully";

        setTimeout(()=>{
            location.href="success.html";
        },1000);
    }
    else{
        document.getElementById("msg_pwd").innerHTML = "❌ Invalid User ID or Password";
    }

    document.getElementById("lui").value="";
    document.getElementById("lupwd").value="";
}

</script>

</body>
</html>
